name: Terraform Multi-Environment Pipeline

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: Environment target
        required: true
        default: all
        type: choice
        options: [all, dev, uat, prod]
      action:
        description: Terraform action for Dev, UAT, and Production
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate all environments
        shell: bash
        run: |
          for environment in dev uat prod; do
            terraform -chdir="environments/${environment}" init -backend=false
            terraform -chdir="environments/${environment}" validate
          done

  deploy-dev:
    name: ${{ inputs.action }} Development
    if: github.event_name == 'workflow_dispatch' && (inputs.environment == 'all' || inputs.environment == 'dev')
    needs: validate
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Development AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-dev-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Development backend
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Create Development plan
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Apply Development plan
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan

  deploy-uat:
    name: ${{ inputs.action }} UAT
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate.result == 'success' &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') &&
      (inputs.environment == 'all' || inputs.environment == 'uat')
    needs: [validate, deploy-dev]
    runs-on: ubuntu-latest
    environment: uat

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: terraform-uat
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/uat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure UAT AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-uat-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize UAT backend
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Create UAT plan
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Apply UAT plan
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan

  deploy-prod:
    name: ${{ inputs.action }} Production
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate.result == 'success' &&
      (needs.deploy-uat.result == 'success' || needs.deploy-uat.result == 'skipped') &&
      (inputs.environment == 'all' || inputs.environment == 'prod')
    needs: [validate, deploy-uat]
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: terraform-prod
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Production AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-prod-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Production backend
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Create Production plan
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Apply Production plan
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        env:
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan
