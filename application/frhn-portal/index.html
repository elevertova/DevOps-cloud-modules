<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front Range Health Network</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      color: #243447;
    }

    header {
      background: #176b87;
      color: white;
      padding: 20px 40px;
    }

    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 40px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      color: #176b87;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      background: #dff5e3;
      color: #216e39;
      border-radius: 6px;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      color: #667788;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <strong>Front Range Health Network</strong>
  </header>

  <main>
    <h1>Patient Services Portal</h1>

    <p>
      Welcome to the Front Range Health Network cloud modernization
      demonstration.
    </p>

    <p>
      This containerized web application is deployed as part of the
      ECS development environment.
    </p>

    <div class="status">Application status: Healthy</div>

    <footer>
      Assessment 18 · Docker and Amazon ECS Fargate
    </footer>
  </main>
</body>
</html>
