apiVersion: apps/v1
kind: Deployment
metadata:
  name: frhn-portal
  namespace: frhn-prod
  labels:
    app.kubernetes.io/name: frhn-portal
    app.kubernetes.io/part-of: frhn-portal
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frhn-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frhn-portal
        app.kubernetes.io/part-of: frhn-portal
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frhn-portal
      containers:
        - name: frhn-portal
          image: 330907589313.dkr.ecr.us-west-2.amazonaws.com/frhn-prod-portal:eks-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
